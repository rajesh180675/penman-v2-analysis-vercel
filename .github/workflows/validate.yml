name: Validate

on:
  pull_request:
  push:
  schedule:
    - cron: "15 2 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Release-grade validation = typecheck + golden suite + full vitest
      # + production build (which transitively runs validate-registry via
      # the prebuild hook, so registry consistency is checked here too).
      - name: Run release-grade validation
        run: npm run validate:release

# Note on ZIP determinism: the byte-stability of generated ZIPs is verified
# by developers locally because CI checkouts have incomplete .xls inputs
# (Bajaj sidecars are tracked but consolidated/standalone .xls are
# gitignored). To verify locally:
#
#   node sync-companies.cjs   # rebuild
#   node sync-companies.cjs   # must be a no-op
#   git status                # must be clean
#
# This catches regressions in JSZip determinism, locale-dependent sorting,
# auto-folder timestamp leaks, etc. before they reach main.
