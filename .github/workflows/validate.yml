name: Validate

on:
  pull_request:
  # Restricted to main. Unfiltered, this ran the entire matrix twice for every
  # same-repo pull request — once for the branch push, once for the PR — which is
  # ~14 duplicate jobs per PR including the 45-minute company-audit shards, and
  # two sets of check results to read when diagnosing a failure.
  #
  # Branch protection's required `validate` context is unaffected: it is
  # evaluated against the PR head commit, which the `pull_request` trigger above
  # still covers. This trigger now serves its actual purpose, validating main
  # after a merge.
  push:
    branches: [main]
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

jobs:
  quality:
    name: Quality, snapshot budget, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:any
      - run: npm run lint:doc-schema
      - run: npm run lint:vercel-functions
      - run: npm run lint:model-catalog
      - name: Real TCS audit transport budget
        run: npm run lint:audit-snapshot
      - run: npm run build
      - run: npm run lint:bundle

  unit-tests:
    name: Unit shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p test-results
      - name: Run timed Vitest shard
        run: npm run test:timed:${{ matrix.shard }}
      - name: Report slowest tests
        if: always()
        run: node scripts/report-slow-tests.mjs test-results/shard-${{ matrix.shard }}.xml 25
      - name: Upload timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: test-results/shard-${{ matrix.shard }}.xml
          if-no-files-found: warn

  golden:
    name: Golden valuation cases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:golden

  company-audit:
    name: Company audit shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --pool=forks src/engine/__tests__/audit-all-companies-shard-${{ matrix.shard }}.spec.ts

  tcs-acceptance:
    name: TCS deep-link audit acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:tcs-audit
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tcs-acceptance-playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # Browser-based axe sweep. Separate from tcs-acceptance so a contrast
  # regression is reported as an accessibility failure rather than buried in a
  # deep-link audit check. This is the only job that can evaluate
  # `color-contrast` — the two jsdom harnesses disable it because jsdom has no
  # layout engine.
  accessibility:
    name: Browser accessibility sweep
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:a11y
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-playwright-report
          path: playwright-report
          if-no-files-found: ignore

  # Full bundled-company pipeline through the real UI: loads four companies from
  # the library, cycles all 19 tabs, and asserts run identity holds across tab
  # switches. Kept out of CI until now because one of its seven tests failed on
  # main — the run-identity check sampled the hash before asynchronous
  # advanced-model governance had settled, so it compared against an identity the
  # app had already superseded. All seven pass, so it can gate.
  #
  # Its own job rather than folded into tcs-acceptance: this is the slowest
  # browser suite (~3 min), and a pipeline regression should be reported as one
  # instead of surfacing under a deep-link audit name. Also carries the fast
  # pre-ingestion smoke spec — see the step comment below.
  pipeline-e2e:
    name: Pipeline and smoke e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Smoke runs first and in the same job: it is ~11s against the same
      # browser and server this job already pays ~2 min of `npm ci` plus a
      # Chromium install to stand up. A separate job would spend two minutes of
      # setup per eleven seconds of testing. Running it first also means a
      # boot-level break is reported before the three-minute pipeline suite.
      - run: npm run test:e2e:smoke
      - run: npm run test:e2e:pipeline
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-e2e-playwright-report
          path: playwright-report
          if-no-files-found: ignore

  release-gate:
    name: Release validation complete
    if: always()
    needs: [quality, unit-tests, golden, company-audit, tcs-acceptance, accessibility, pipeline-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce every parallel gate
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit-tests.result }}
          GOLDEN: ${{ needs.golden.result }}
          AUDIT: ${{ needs.company-audit.result }}
          TCS_ACCEPTANCE: ${{ needs.tcs-acceptance.result }}
          ACCESSIBILITY: ${{ needs.accessibility.result }}
          PIPELINE_E2E: ${{ needs.pipeline-e2e.result }}
        run: |
          test "$QUALITY" = success
          test "$UNIT" = success
          test "$GOLDEN" = success
          test "$AUDIT" = success
          test "$TCS_ACCEPTANCE" = success
          test "$ACCESSIBILITY" = success
          test "$PIPELINE_E2E" = success

  # Compatibility context required by the protected main branch. Keep this
  # as a real aggregate gate rather than a manually-created commit status.
  validate:
    name: validate
    if: always()
    needs: [quality, unit-tests, golden, company-audit, tcs-acceptance, accessibility, pipeline-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce protected-branch validation
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit-tests.result }}
          GOLDEN: ${{ needs.golden.result }}
          AUDIT: ${{ needs.company-audit.result }}
          TCS_ACCEPTANCE: ${{ needs.tcs-acceptance.result }}
          ACCESSIBILITY: ${{ needs.accessibility.result }}
          PIPELINE_E2E: ${{ needs.pipeline-e2e.result }}
        run: |
          test "$QUALITY" = success
          test "$UNIT" = success
          test "$GOLDEN" = success
          test "$AUDIT" = success
          test "$TCS_ACCEPTANCE" = success
          test "$ACCESSIBILITY" = success
          test "$PIPELINE_E2E" = success

# ZIP determinism remains a local release check because CI checkouts omit
# gitignored Capitaline .xls sources. Run sync-companies.cjs twice; the second
# run must be a no-op before publishing a registry change.
